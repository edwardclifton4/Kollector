<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Kollector</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #111; color: #eee; }
  header { padding: 12px 16px; font-size: 1.2rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .row { display: flex; gap: 8px; padding: 0 16px 12px; align-items: center; }
  input, select { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1c1c1c; color: #eee; font-size: 1rem; min-width: 0; }
  button { padding: 10px 14px; border-radius: 8px; border: none; background: #2a6df4; color: #fff; font-size: 0.95rem; }
  button.secondary { background: #333; }
  button.danger { background: #7a2a2a; }
  button.big { width: 100%; padding: 14px; font-size: 1.05rem; }
  #scanArea { padding: 0 16px 12px; }
  #reader { width: 100%; max-width: 480px; margin: 0 auto; }
  #status { text-align: center; min-height: 1.4em; padding: 4px 8px 8px; color: #9fd; }
  .tabs { display: flex; gap: 8px; padding: 0 16px 12px; }
  .tabs button { flex: 1; }
  .tabs button.inactive { background: #333; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
  .controls select { flex: 1 1 30%; }
  .note { padding: 0 16px 8px; color: #999; font-size: 0.85rem; }
  #count { padding: 0 16px 8px; color: #999; font-size: 0.9rem; }
  h3 { margin: 16px 16px 4px; font-size: 1rem; color: #8ab4ff; }
  ul { list-style: none; margin: 0; padding: 0 16px 24px; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #222; }
  .title { cursor: pointer; flex: 1; min-width: 0; }
  .rowitem { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .thumb { width: 46px; height: 69px; object-fit: cover; border-radius: 4px; background: #222; flex: 0 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 12px 16px; }
  .tile { cursor: pointer; min-width: 0; }
  .tile img, .placeholder { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 4px; display: block; background: #222; box-sizing: border-box; }
  .placeholder { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.7rem; padding: 4px; color: #aaa; }
  .meta { color: #777; font-size: 0.8rem; }
  .found .title { text-decoration: line-through; color: #777; }
  .found-tag { color: #6c6; font-size: 0.8rem; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { background: #1c1c1c; padding: 20px; border-radius: 12px; max-width: 380px; width: 100%; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
  .card h2 { margin: 0 0 8px; font-size: 1.2rem; }
  .card p { margin: 0 0 12px; color: #aaa; font-size: 0.9rem; }
  .card .row { padding: 0 0 12px; }
  .card .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .card .btns button { flex: 1; }
  .card .stack { display: flex; flex-direction: column; gap: 8px; }
  #mResults { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  #mResults button { background: #2b2b2b; text-align: left; }
  #mResults button.sel { background: #2a6df4; }
</style>
</head>
<body>
<header>
  <span>Kollector</span>
  <button class="secondary" id="exportBtn">Export</button>
</header>

<div id="scanArea">
  <button class="big" id="scanBtn">Scan</button>
  <div id="reader" style="display:none"></div>
</div>
<div id="status"></div>

<div class="row">
  <input id="searchInput" placeholder="Type a UPC or movie title">
  <button id="searchBtn">Search</button>
</div>

<div class="tabs">
  <button id="tabColl">Collection</button>
  <button id="tabWish" class="inactive">Wish list</button>
</div>

<div id="collView">
  <div id="count"></div>
  <div class="controls">
    <select id="displayBy">
      <option value="list">Show as list</option>
      <option value="posters">Show posters</option>
    </select>
    <select id="groupBy">
      <option value="genre">Group by genre</option>
      <option value="none">No grouping</option>
    </select>
    <select id="sortBy">
      <option value="az">Title A–Z</option>
      <option value="year_new">Year, newest first</option>
      <option value="year_old">Year, oldest first</option>
      <option value="added">Recently added</option>
    </select>
  </div>
  <div id="genreNote" class="note" style="display:none"></div>
  <div class="row" id="fillRow" style="display:none">
    <button class="secondary" id="fillBtn" style="flex:1"></button>
  </div>
  <div id="collList"></div>
</div>

<div id="wishView" style="display:none">
  <div class="row">
    <input id="wishInput" placeholder="Movie title you're looking for">
    <button id="wishBtn">Add</button>
  </div>
  <ul id="wishList"></ul>
</div>

<div id="exportModal" class="modal">
  <div class="card">
    <h2>Export</h2>
    <p>Exports follow your current grouping and sort settings.</p>
    <div class="stack">
      <button id="exTitles">Titles only (.txt)</button>
      <button id="exGenre">Titles by genre (.txt)</button>
      <button id="exPosters">Posters, 4 per row (.html)</button>
      <button id="exCsv">Full details (.csv)</button>
      <button id="exCancel" class="secondary">Cancel</button>
    </div>
    <p style="margin-top:12px">To print posters, open the .html file on your phone and use Share → Print, or save it as a PDF.</p>
  </div>
</div>

<div id="modal" class="modal">
  <div class="card">
    <img id="mPoster" class="thumb" style="width:120px;height:180px;margin:0 0 12px" alt="">
    <h2 id="mTitle"></h2>
    <p id="mMeta"></p>
    <p id="mUpc"></p>
    <div class="row">
      <input id="mSearch" placeholder="Search by title">
      <button id="mSearchBtn" class="secondary">Search</button>
    </div>
    <div id="mResults"></div>
    <div class="btns">
      <button id="mYes">Yes, add it</button>
      <button id="mNo" class="secondary">No</button>
      <button id="mRescan" class="secondary">Scan next</button>
    </div>
  </div>
</div>

<script>
const KEY = 'movieCollection', WKEY = 'movieWishlist', BKEY = 'barcodeMap', PKEY = 'viewPrefs';
const $ = id => document.getElementById(id);
const status = msg => { $('status').textContent = msg; };
const norm = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const load = (k, fallback) => { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch (e) { return fallback; } };

let items = load(KEY, []);
let wishes = load(WKEY, []);
let barcodeMap = load(BKEY, {});
let prefs = Object.assign({ groupBy: 'genre', sortBy: 'az', display: 'list' }, load(PKEY, {}));
let view = 'collection';
let busy = false;
let pending = null;
let pendingResults = [];
let cameraRunning = false;
const scanner = new Html5Qrcode('reader');

function persist() {
  localStorage.setItem(KEY, JSON.stringify(items));
  localStorage.setItem(WKEY, JSON.stringify(wishes));
  localStorage.setItem(BKEY, JSON.stringify(barcodeMap));
  localStorage.setItem(PKEY, JSON.stringify(prefs));
}

/* ---------- Camera ---------- */
async function startCamera() {
  if (cameraRunning) return;
  $('reader').style.display = 'block';
  try {
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 160 }, formatsToSupport: [0, 3, 7] },
      handleScan,
      () => {}
    );
    cameraRunning = true;
    $('scanBtn').textContent = 'Stop scanning';
    status('Point the camera at a barcode.');
  } catch (err) {
    $('reader').style.display = 'none';
    status('Camera error: ' + err + '. Check that camera access is allowed for this site in Settings > Safari.');
  }
}

async function stopCamera() {
  if (!cameraRunning) return;
  try { await scanner.stop(); } catch (e) {}
  cameraRunning = false;
  $('reader').style.display = 'none';
  $('scanBtn').textContent = 'Scan';
}

async function rescan() {
  await stopCamera();
  busy = false;
  await startCamera();
}

/* ---------- TMDb (via server proxy) ---------- */
async function tmdbApi(path, extra) {
  try {
    const r = await fetch('/api/tmdb?path=' + encodeURIComponent(path) + (extra || ''));
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      return { error: j.error || ('Lookup failed (' + r.status + ').') };
    }
    return { data: await r.json() };
  } catch (e) {
    return { error: 'Could not reach the lookup service. Check your connection.' };
  }
}

async function searchMovies(q) {
  const r = await tmdbApi('search/movie', '&query=' + encodeURIComponent(q));
  if (r.error) return { error: r.error };
  return {
    results: (r.data.results || []).slice(0, 5).map(h => ({
      tmdbId: h.id, title: h.title, year: (h.release_date || '').slice(0, 4), poster: h.poster_path || null
    }))
  };
}

async function pickResult(hit) {
  const r = await tmdbApi('movie/' + hit.tmdbId);
  const genres = r.data ? (r.data.genres || []).map(g => g.name) : [];
  return { tmdbId: hit.tmdbId, title: hit.title, year: hit.year, genres, poster: hit.poster };
}

async function fetchGenreAndYear(q) {
  const s = await searchMovies(q);
  if (s.error) return { error: s.error };
  if (!s.results.length) return null;
  return pickResult(s.results[0]);
}

function cleanTitle(t) {
  return (t || '')
    .replace(/\[.*?\]|\(.*?\)/g, '')
    .replace(/\b(blu-?ray|dvd|4k|uhd|steelbook)\b/gi, '')
    .replace(/\s+/g, ' ')
    .trim();
}

async function upcTitle(upc) {
  try {
    const r = await fetch('/api/lookup?upc=' + encodeURIComponent(upc));
    const j = await r.json();
    return j.title || null;
  } catch (e) {
    return null;
  }
}

/* ---------- Confirm modal ---------- */
function showPending(note) {
  const c = pending;
  $('mTitle').textContent = c.title + (c.year ? ' (' + c.year + ')' : '');
  $('mMeta').textContent = note || (c.tmdbId
    ? 'Genre: ' + (c.genres && c.genres.length ? c.genres.join(', ') : 'not listed')
    : 'No TMDb match. It will be saved as Uncategorized unless you pick a result.');
  $('mUpc').textContent = c.upc ? 'Barcode: ' + c.upc : '';
  const pi = $('mPoster');
  if (c.poster) { pi.src = 'https://image.tmdb.org/t/p/w185' + c.poster; pi.style.display = 'block'; }
  else { pi.removeAttribute('src'); pi.style.display = 'none'; }
  $('mSearch').value = c.title;
  const box = $('mResults');
  box.innerHTML = '';
  pendingResults.forEach(hit => {
    const b = document.createElement('button');
    b.textContent = hit.title + (hit.year ? ' (' + hit.year + ')' : '');
    if (hit.tmdbId === c.tmdbId) b.className = 'sel';
    b.onclick = async () => {
      status('Loading...');
      const p = await pickResult(hit);
      Object.assign(pending, p);
      status('');
      showPending();
    };
    box.appendChild(b);
  });
}

function openModal(c, results) {
  pending = c;
  pendingResults = results || [];
  busy = true;
  showPending();
  $('modal').style.display = 'flex';
}

function closeModal() {
  $('modal').style.display = 'none';
  pending = null;
  pendingResults = [];
  busy = false;
}

async function searchInModal() {
  const q = $('mSearch').value.trim();
  if (!q || !pending) return;
  status('Searching...');
  const s = await searchMovies(q);
  if (s.error) { status(s.error); showPending(s.error); return; }
  if (!s.results.length) {
    pendingResults = [];
    status('');
    showPending('No results for "' + q + '".');
    return;
  }
  pendingResults = s.results;
  Object.assign(pending, await pickResult(s.results[0]));
  status('');
  showPending();
}

function confirmAdd() {
  const c = pending;
  if (!c) return;
  items.push({
    upc: c.upc || '',
    title: c.title,
    year: c.year,
    tmdbId: c.tmdbId || null,
    poster: c.poster || null,
    genres: c.genres && c.genres.length ? c.genres : ['Uncategorized'],
    added: new Date().toISOString()
  });
  if (c.upc) {
    barcodeMap[c.upc] = { title: c.title, year: c.year, tmdbId: c.tmdbId || null, genres: c.genres || [], poster: c.poster || null };
  }
  const w = wishes.find(w => !w.found && ((c.tmdbId && w.tmdbId === c.tmdbId) || norm(w.title) === norm(c.title)));
  if (w) {
    w.found = true;
    w.foundDate = new Date().toISOString();
    status('Crossed off wish list: ' + w.title);
  } else {
    status('Added: ' + c.title);
  }
  persist();
  closeModal();
  render();
}

/* ---------- Scanning and searching ---------- */
async function handleScan(text) {
  const upc = (text || '').trim();
  if (!upc || busy) return;
  busy = true;
  try {
    if (items.some(i => i.upc === upc)) {
      status('Already in your collection');
    } else if (barcodeMap[upc]) {
      openModal({ upc, ...barcodeMap[upc] }, []);
      return;
    } else {
      status('Looking up ' + upc + '...');
      let raw = await upcTitle(upc);
      if (!raw) {
        raw = prompt('No barcode match for ' + upc + '. Enter the title (or cancel to skip):');
        if (!raw) { status('Skipped'); busy = false; return; }
      }
      const q = cleanTitle(raw);
      const s = await searchMovies(q);
      status('');
      if (s.error || !s.results.length) {
        openModal({ upc, title: q, year: '', tmdbId: null, genres: [] }, []);
        showPending(s.error || 'No TMDb results for "' + q + '". Search again or save as Uncategorized.');
        return;
      }
      const p = await pickResult(s.results[0]);
      openModal({ upc, ...p }, s.results);
      return;
    }
  } catch (e) {
    status('Error: ' + e);
  }
  setTimeout(() => { busy = false; }, 1500);
}

async function searchTitle() {
  const q = $('searchInput').value.trim();
  if (!q) return;
  $('searchInput').value = '';
  if (/^\d{8,14}$/.test(q)) return handleScan(q);
  status('Searching...');
  const s = await searchMovies(q);
  if (s.error) { status(s.error); return; }
  if (!s.results.length) { status('No results for "' + q + '".'); return; }
  const p = await pickResult(s.results[0]);
  if (items.some(i => i.tmdbId === p.tmdbId)) {
    status('Already in your collection: ' + p.title);
    return;
  }
  status('');
  openModal({ upc: '', ...p }, s.results);
}

/* ---------- Wish list ---------- */
async function addWish() {
  const t = $('wishInput').value.trim();
  if (!t) return;
  status('Searching...');
  const s = await searchMovies(t);
  let wish = { title: t, year: '', tmdbId: null, found: false, added: new Date().toISOString() };
  if (s.error) {
    status(s.error + ' Saved as typed.');
  } else if (s.results.length) {
    const hit = s.results[0];
    wish = { title: hit.title, year: hit.year, tmdbId: hit.tmdbId, found: false, added: new Date().toISOString() };
  }
  if (wish.tmdbId && items.some(i => i.tmdbId === wish.tmdbId)) {
    wish.found = true;
    wish.foundDate = new Date().toISOString();
    status('You already own this one');
  } else if (!s.error) {
    status('Added to wish list: ' + wish.title);
  }
  wishes.push(wish);
  $('wishInput').value = '';
  persist();
  render();
}

/* ---------- Collection: sorting, grouping, rendering ---------- */
function needsGenre(it) {
  return !it.genres || !it.genres.length || it.genres[0] === 'Uncategorized';
}

function sortEntries(entries) {
  const yr = e => Number(e.it.year) || 0;
  const cmp = {
    az: (a, b) => a.it.title.localeCompare(b.it.title),
    year_new: (a, b) => (yr(b) - yr(a)) || a.it.title.localeCompare(b.it.title),
    year_old: (a, b) => (yr(a) - yr(b)) || a.it.title.localeCompare(b.it.title),
    added: (a, b) => (b.it.added || '').localeCompare(a.it.added || '')
  }[prefs.sortBy] || ((a, b) => a.it.title.localeCompare(b.it.title));
  return entries.sort(cmp);
}

function groupEntries(entries) {
  const groups = {};
  entries.forEach(e => {
    const g = (e.it.genres && e.it.genres[0]) || 'Uncategorized';
    (groups[g] = groups[g] || []).push(e);
  });
  return groups;
}

function makeItemRow(entry) {
  const { it, idx } = entry;
  const li = document.createElement('li');
  const wrap = document.createElement('div');
  wrap.className = 'rowitem';
  if (it.poster) {
    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = 'https://image.tmdb.org/t/p/w92' + it.poster;
    img.alt = '';
    img.loading = 'lazy';
    wrap.appendChild(img);
  }
  const t = document.createElement('div');
  t.className = 'title';
  t.textContent = it.title + (it.year ? ' (' + it.year + ')' : '');
  t.onclick = () => {
    const nt = prompt('Edit title:', it.title);
    if (nt && nt.trim()) { items[idx].title = nt.trim(); persist(); render(); }
  };
  wrap.appendChild(t);
  const del = document.createElement('button');
  del.textContent = 'Delete';
  del.className = 'danger';
  del.onclick = () => {
    if (confirm('Delete "' + it.title + '"?')) { items.splice(idx, 1); persist(); render(); }
  };
  li.append(wrap, del);
  return li;
}

function makePosterTile(entry) {
  const { it, idx } = entry;
  const d = document.createElement('div');
  d.className = 'tile';
  if (it.poster) {
    const img = document.createElement('img');
    img.src = 'https://image.tmdb.org/t/p/w185' + it.poster;
    img.alt = it.title;
    img.loading = 'lazy';
    d.appendChild(img);
  } else {
    const p = document.createElement('div');
    p.className = 'placeholder';
    p.textContent = it.title;
    d.appendChild(p);
  }
  // Tap a poster to delete it. Use list view to edit titles.
  d.onclick = () => {
    if (confirm('Delete "' + it.title + '"?')) { items.splice(idx, 1); persist(); render(); }
  };
  return d;
}

function appendEntries(container, list) {
  if (prefs.display === 'posters') {
    const grid = document.createElement('div');
    grid.className = 'grid';
    list.forEach(e => grid.appendChild(makePosterTile(e)));
    container.appendChild(grid);
  } else {
    const ul = document.createElement('ul');
    list.forEach(e => ul.appendChild(makeItemRow(e)));
    container.appendChild(ul);
  }
}

function renderCollection() {
  $('count').textContent = items.length + ' movies';
  const entries = sortEntries(items.map((it, idx) => ({ it, idx })));
  const box = $('collList');
  box.innerHTML = '';

  if (prefs.groupBy === 'genre') {
    const groups = groupEntries(entries);
    Object.keys(groups).sort().forEach(g => {
      const h = document.createElement('h3');
      h.textContent = g + ' (' + groups[g].length + ')';
      box.appendChild(h);
      appendEntries(box, groups[g]);
    });
  } else {
    appendEntries(box, entries);
  }

  const missing = items.filter(needsGenre).length;
  if (missing) {
    $('genreNote').style.display = 'block';
    $('genreNote').textContent = missing + ' title' + (missing === 1 ? ' has' : 's have') +
      ' no genre yet, usually because they were added before genres were supported. The button below looks them up on TMDb.';
    $('fillRow').style.display = 'flex';
    $('fillBtn').textContent = 'Update genres for ' + missing + ' title' + (missing === 1 ? '' : 's');
  } else {
    $('genreNote').style.display = 'none';
    $('fillRow').style.display = 'none';
  }
}

async function fillGenres() {
  const todo = items.filter(needsGenre);
  if (!todo.length) return;
  let n = 0;
  for (const it of todo) {
    status('Updating genres: ' + (++n) + ' of ' + todo.length);
    const info = await fetchGenreAndYear(cleanTitle(it.title));
    if (info && info.error) { status(info.error); break; }
    if (info) {
      it.tmdbId = info.tmdbId;
      it.year = info.year;
      it.poster = info.poster || it.poster;
      it.genres = info.genres.length ? info.genres : ['Uncategorized'];
    }
  }
  persist();
  render();
  status('Genres updated.');
}

function renderWishes() {
  const ul = $('wishList');
  ul.innerHTML = '';
  wishes.forEach((w, idx) => {
    const li = document.createElement('li');
    if (w.found) li.className = 'found';
    const t = document.createElement('div');
    t.className = 'title';
    t.textContent = w.title + (w.year ? ' (' + w.year + ')' : '');
    const tag = document.createElement('div');
    tag.className = w.found ? 'found-tag' : 'meta';
    tag.textContent = w.found ? 'Found' : 'Wanted';
    t.appendChild(tag);
    t.onclick = () => { wishes[idx].found = !wishes[idx].found; persist(); render(); };
    const del = document.createElement('button');
    del.textContent = 'Remove';
    del.className = 'danger';
    del.onclick = () => { wishes.splice(idx, 1); persist(); render(); };
    li.append(t, del);
    ul.appendChild(li);
  });
}

function render() {
  $('collView').style.display = view === 'collection' ? 'block' : 'none';
  $('wishView').style.display = view === 'wish' ? 'block' : 'none';
  $('tabColl').className = view === 'collection' ? '' : 'inactive';
  $('tabWish').className = view === 'wish' ? '' : 'inactive';
  $('displayBy').value = prefs.display;
  $('groupBy').value = prefs.groupBy;
  $('sortBy').value = prefs.sortBy;
  renderCollection();
  renderWishes();
}

/* ---------- Export ---------- */
function download(text, filename, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = filename;
  a.click();
}

function exportTitles() {
  const entries = sortEntries(items.map((it, idx) => ({ it, idx })));
  const text = entries.map(e => e.it.title).join('\n');
  download(text + '\n', 'kollector-titles.txt', 'text/plain');
}

function exportByGenre() {
  const entries = sortEntries(items.map((it, idx) => ({ it, idx })));
  const groups = groupEntries(entries);
  const text = Object.keys(groups).sort().map(g =>
    g + '\n' + groups[g].map(e => e.it.title).join('\n')
  ).join('\n\n');
  download(text + '\n', 'kollector-by-genre.txt', 'text/plain');
}

function exportPosters() {
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const entries = sortEntries(items.map((it, idx) => ({ it, idx })));
  const tile = e => e.it.poster
    ? '<div class="p"><img src="https://image.tmdb.org/t/p/w342' + esc(e.it.poster) + '" alt="' + esc(e.it.title) + '"></div>'
    : '<div class="p"><div class="ph">' + esc(e.it.title) + '</div></div>';
  let body = '';
  if (prefs.groupBy === 'genre') {
    const groups = groupEntries(entries);
    Object.keys(groups).sort().forEach(g => {
      body += '<h2>' + esc(g) + ' (' + groups[g].length + ')</h2><div class="grid">' + groups[g].map(tile).join('') + '</div>';
    });
  } else {
    body = '<div class="grid">' + entries.map(tile).join('') + '</div>';
  }
  const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<title>Kollector posters</title><style>' +
    'body{font-family:-apple-system,system-ui,sans-serif;margin:16px;background:#fff;color:#111}' +
    'h1{font-size:20px}h2{margin:24px 0 8px;font-size:16px}' +
    '.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}' +
    '.p img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;border-radius:4px;background:#ddd}' +
    '.ph{display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;padding:4px;box-sizing:border-box}' +
    '@media print{body{margin:0}h2{break-after:avoid}}' +
    '</style></head><body><h1>Kollector</h1>' + body + '</body></html>';
  download(html, 'kollector-posters.html', 'text/html');
}

function exportCsv() {
  const rows = [['title', 'year', 'genre', 'upc', 'added']];
  items.forEach(i => rows.push([i.title, i.year || '', (i.genres || []).join('; '), i.upc || '', i.added]));
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  download(csv, 'kollector.csv', 'text/csv');
}

/* ---------- Wiring ---------- */
$('scanBtn').onclick = () => (cameraRunning ? stopCamera() : startCamera());
$('searchBtn').onclick = searchTitle;
$('searchInput').onkeydown = e => { if (e.key === 'Enter') searchTitle(); };
$('exportBtn').onclick = () => { $('exportModal').style.display = 'flex'; };
$('exCancel').onclick = () => { $('exportModal').style.display = 'none'; };
$('exTitles').onclick = () => { $('exportModal').style.display = 'none'; exportTitles(); };
$('exGenre').onclick = () => { $('exportModal').style.display = 'none'; exportByGenre(); };
$('exPosters').onclick = () => { $('exportModal').style.display = 'none'; exportPosters(); };
$('exCsv').onclick = () => { $('exportModal').style.display = 'none'; exportCsv(); };
$('displayBy').onchange = e => { prefs.display = e.target.value; persist(); render(); };
$('groupBy').onchange = e => { prefs.groupBy = e.target.value; persist(); render(); };
$('sortBy').onchange = e => { prefs.sortBy = e.target.value; persist(); render(); };
$('fillBtn').onclick = fillGenres;
$('wishBtn').onclick = addWish;
$('tabColl').onclick = () => { view = 'collection'; render(); };
$('tabWish').onclick = () => { view = 'wish'; render(); };
$('mSearchBtn').onclick = searchInModal;
$('mSearch').onkeydown = e => { if (e.key === 'Enter') searchInModal(); };
$('mYes').onclick = confirmAdd;
$('mNo').onclick = () => { status('Skipped'); closeModal(); };
$('mRescan').onclick = () => { closeModal(); rescan(); };

render();
</script>
