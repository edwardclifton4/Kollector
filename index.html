<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Kollector</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #111; color: #eee; }
  header { padding: 12px 16px; font-size: 1.2rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  #reader { width: 100%; max-width: 480px; margin: 0 auto; }
  #status { text-align: center; min-height: 1.4em; padding: 8px; color: #9fd; }
  .row { display: flex; gap: 8px; padding: 0 16px 12px; }
  input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1c1c1c; color: #eee; font-size: 1rem; }
  button { padding: 10px 14px; border-radius: 8px; border: none; background: #2a6df4; color: #fff; font-size: 0.95rem; }
  button.secondary { background: #333; }
  button.danger { background: #7a2a2a; }
  #count { padding: 0 16px 8px; color: #999; font-size: 0.9rem; }
  ul { list-style: none; margin: 0; padding: 0 16px 40px; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #222; }
  .title { cursor: pointer; flex: 1; }
  .upc { color: #777; font-size: 0.8rem; }
</style>
</head>
<body>
<header>
  <span>Kollector</span>
  <button class="secondary" id="exportBtn">Export CSV</button>
</header>

<div id="reader"></div>
<div id="status"></div>

<div class="row">
  <input id="manualUpc" inputmode="numeric" placeholder="Or type a UPC">
  <button id="manualBtn">Add</button>
</div>

<div id="count"></div>
<ul id="list"></ul>

<script>
const KEY = 'movieCollection';
let items = JSON.parse(localStorage.getItem(KEY) || '[]');
let busy = false;
const scanner = new Html5Qrcode('reader');

const $ = id => document.getElementById(id);
const status = msg => { $('status').textContent = msg; };
const save = () => localStorage.setItem(KEY, JSON.stringify(items));

async function lookupTitle(upc) {
  try {
    const r = await fetch('https://api.upcitemdb.com/prod/trial/lookup?upc=' + encodeURIComponent(upc));
    const j = await r.json();
    return (j.items && j.items[0] && j.items[0].title) || null;
  } catch (e) {
    return null;
  }
}

async function addUpc(upc) {
  upc = upc.trim();
  if (!upc) return;
  if (items.some(i => i.upc === upc)) {
    status('Already in your collection: ' + upc);
    return;
  }
  status('Looking up ' + upc + '...');
  let title = await lookupTitle(upc);
  if (!title) {
    title = prompt('No match found for ' + upc + '. Enter the title (or cancel to skip):');
    if (!title) { status('Skipped ' + upc); return; }
  }
  items.push({ upc, title, added: new Date().toISOString() });
  save();
  render();
  status('Added: ' + title);
}

function render() {
  $('count').textContent = items.length + ' movies';
  const list = $('list');
  list.innerHTML = '';
  items.slice().reverse().forEach((item, revIdx) => {
    const idx = items.length - 1 - revIdx;
    const li = document.createElement('li');
    const text = document.createElement('div');
    text.className = 'title';
    text.innerHTML = '<div></div><div class="upc"></div>';
    text.firstChild.textContent = item.title;
    text.lastChild.textContent = item.upc;
    text.onclick = () => {
      const t = prompt('Edit title:', item.title);
      if (t !== null && t.trim()) { items[idx].title = t.trim(); save(); render(); }
    };
    const del = document.createElement('button');
    del.textContent = 'Delete';
    del.className = 'danger';
    del.onclick = () => {
      if (confirm('Delete "' + item.title + '"?')) { items.splice(idx, 1); save(); render(); }
    };
    li.append(text, del);
    list.appendChild(li);
  });
}

async function onScan(text) {
  if (busy) return;
  busy = true;
  try {
    await addUpc(text);
  } finally {
    setTimeout(() => { busy = false; }, 1500);
  }
}

function exportCsv() {
  const rows = [['title', 'upc', 'added']];
  items.forEach(i => rows.push([i.title, i.upc, i.added]));
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'movie-collection.csv';
  a.click();
}

$('manualBtn').onclick = () => { addUpc($('manualUpc').value); $('manualUpc').value = ''; };
$('exportBtn').onclick = exportCsv;

scanner.start(
  { facingMode: 'environment' },
  { fps: 10, qrbox: { width: 260, height: 160 }, formatsToSupport: [0, 3, 7] },
  onScan,
  () => {}
).catch(err => status('Camera error: ' + err + '. The page must be served over HTTPS and camera access allowed.'));

render();
</script>
</body>
</html>
